name: CI

# Every simulator is asserted against its closed-form solution before anything
# is allowed to render. This is the check the demo points at.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Physics invariants and closed-form assertions
        run: npm test
      - name: Build
        run: npm run build
